name: Research national routes

on:
  push:
    branches: [main, "quality/research-all-routes"]
    paths:
      - "scripts/enrich-national-routes.mjs"
      - "scripts/validate-national-research.mjs"
      - "src/data/meralar-ulusal.js"
      - "src/data/meralar-ulusal-koordinatlar.js"
      - "src/data/meralar-ulusal-manuel-arastirma.js"
      - "src/data/meralar-ulusal-otomatik-arastirma.js"
      - ".github/workflows/research-national-routes.yml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "scripts/enrich-national-routes.mjs"
      - "scripts/validate-national-research.mjs"
      - "src/data/meralar-ulusal.js"
      - "src/data/meralar-ulusal-koordinatlar.js"
      - "src/data/meralar-ulusal-manuel-arastirma.js"
      - "src/data/meralar-ulusal-otomatik-arastirma.js"
      - ".github/workflows/research-national-routes.yml"
      - "package.json"
  schedule:
    # 06:17 Europe/Istanbul; GitHub may start scheduled runs later.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: national-route-research-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  research-and-cache:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Research 405 national routes
        env:
          RESEARCH_CONTACT: balikrotasi1041@gmail.com
          RESEARCH_USER_AGENT: "OltaAtlasi/1.0 (+https://oltaatlasi.com/sorumluluk-ve-kullanim/)"
        run: npm run research:national

      - name: Validate research completeness
        run: npm run validate:research

      - name: Validate route data
        run: npm run validate:data

      - name: Build researched site
        env:
          PUBLIC_SITE_URL: https://oltaatlasi.com
        run: npm run build

      - name: Validate dry deployment
        run: npm run deploy:dry

      - name: Commit research cache
        id: cache
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/meralar-ulusal-otomatik-arastirma.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Araştırma önbelleğinde değişiklik yok."
            exit 0
          fi
          git config user.name "oltaatlasi-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/meralar-ulusal-otomatik-arastirma.js
          git commit -m "data: cache researched fish access and accommodation evidence"
          git fetch origin "$TARGET_BRANCH"
          # Never publish a rebase that has not passed the preceding checks.
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/$TARGET_BRANCH)"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch verified production deployment
        if: steps.cache.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Record outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CACHE_CHANGED: ${{ steps.cache.outputs.changed }}
        run: |
          echo "Research status: ${JOB_STATUS}; cache committed: ${CACHE_CHANGED:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Discovery cache only: confidence and indexing are not promoted automatically. Daily index cap remains 2." >> "$GITHUB_STEP_SUMMARY"
