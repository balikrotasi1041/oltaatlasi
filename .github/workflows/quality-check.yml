name: Quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether scheduled main needs validation
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "needs_check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality-check.yml/runs?branch=main&status=success&per_page=30")

          if echo "$runs" | jq -e --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha)' >/dev/null; then
            echo "Current main SHA ${GITHUB_SHA} already passed Quality check; scheduled heavy validation skipped."
            echo "needs_check=false" >> "$GITHUB_OUTPUT"
          else
            echo "Current main SHA ${GITHUB_SHA} has no successful Quality check; validation required."
            echo "needs_check=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.needs_check == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.needs_check == 'true'
        run: npm ci

      - name: Build
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run build

      - name: Dry deploy
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run deploy:dry

      - name: Dispatch production deploy for validated main SHA
        if: steps.guard.outputs.needs_check == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Production deploy workflow dispatched for validated main ${GITHUB_SHA}."
