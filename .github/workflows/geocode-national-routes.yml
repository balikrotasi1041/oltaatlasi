name: Geocode national route pins

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "src/data/meralar-ulusal.js"
      - "scripts/geocode-national-routes.mjs"
      - ".github/workflows/geocode-national-routes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: national-route-geocoding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geocode-build-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and cache coordinates
        env:
          NOMINATIM_USER_AGENT: "OltaAtlasi/1.0 (+https://oltaatlasi.com/sorumluluk-ve-kullanim/)"
        run: npm run geocode:national

      - name: Validate route and coordinate data
        run: npm run validate:data

      - name: Build site with generated pins
        env:
          PUBLIC_SITE_URL: https://oltaatlasi.com
        run: npm run build

      - name: Commit coordinate cache
        id: cache
        run: |
          if git diff --quiet -- src/data/meralar-ulusal-koordinatlar.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Koordinat önbelleğinde değişiklik yok."
            exit 0
          fi
          git config user.name "oltaatlasi-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/meralar-ulusal-koordinatlar.js
          git commit -m "data: cache national route map coordinates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy generated main build
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            curl --fail --show-error --silent --request POST "$CLOUDFLARE_DEPLOY_HOOK"
            echo "Cloudflare deploy hook tetiklendi."
          elif [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "Cloudflare Git entegrasyonunun main dalı push'unu yayımlaması bekleniyor."
          fi
