name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olta-atlasi-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_SITE_URL: https://oltaatlasi.com
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Current wrangler.jsonc ile doğrudan Worker deploy ediliyor."
            npx wrangler deploy
          elif [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            curl --fail --show-error --silent --request POST "$CLOUDFLARE_DEPLOY_HOOK"
            echo "Cloudflare deploy hook tetiklendi."
          else
            echo "::error::CLOUDFLARE_API_TOKEN veya CLOUDFLARE_DEPLOY_HOOK GitHub secret olarak tanımlı değil."
            exit 1
          fi

      - name: Verify Cloudflare RUM after deploy
        shell: bash
        run: |
          set -euo pipefail
          url="https://oltaatlasi.com/?rum-deploy-check=${GITHUB_SHA}"
          beacon_ok=0

          for attempt in 1 2 3 4 5; do
            curl --fail --show-error --silent --location \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml' \
              -D /tmp/rum-headers.txt "$url" -o /tmp/rum-home.html

            if grep -q 'static.cloudflareinsights.com/beacon.min.js' /tmp/rum-home.html; then
              beacon_ok=1
              break
            fi

            echo "RUM beacon henüz görünmüyor (deneme ${attempt}/5); Cloudflare yayılımı bekleniyor."
            sleep 6
          done

          if [ "$beacon_ok" -ne 1 ]; then
            echo "::error::Canlı HTML içinde Cloudflare Web Analytics RUM beacon bulunamadı."
            exit 1
          fi

          if grep -Eiq '^cache-control:.*no-transform' /tmp/rum-headers.txt; then
            echo "::error::Cache-Control no-transform Cloudflare'ın otomatik RUM enjeksiyonunu engelleyebilir."
            exit 1
          fi

          beacon_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'https://static.cloudflareinsights.com/beacon.min.js')
          if [ "$beacon_status" -lt 200 ] || [ "$beacon_status" -ge 400 ]; then
            echo "::error::Cloudflare beacon betiğine ulaşılamadı; HTTP ${beacon_status}."
            exit 1
          fi

          rum_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'https://oltaatlasi.com/cdn-cgi/rum')
          case "$rum_status" in
            404|5??)
              echo "::error::Cloudflare RUM toplama endpoint'i sağlıklı görünmüyor; HTTP ${rum_status}."
              exit 1
              ;;
            *)
              echo "Cloudflare RUM doğrulandı: beacon enjekte edildi, betik erişilebilir, endpoint HTTP ${rum_status}."
              ;;
          esac
