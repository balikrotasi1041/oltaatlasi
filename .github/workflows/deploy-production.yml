name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: olta-atlasi-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_SITE_URL: https://oltaatlasi.com
    steps:
      - name: Decide whether this SHA needs production deploy
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          needs_deploy=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            statuses=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")
            if echo "$statuses" | jq -e '.statuses[]? | select(.context == "production/cloudflare" and .state == "success")' >/dev/null; then
              needs_deploy=false
              echo "Current main SHA already has verified Cloudflare production status; scheduled retry skipped."
            fi
          fi
          echo "needs_deploy=${needs_deploy}" >> "$GITHUB_OUTPUT"

      - name: Mark production deploy pending
        if: steps.guard.outputs.needs_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"production/cloudflare","description":"Cloudflare production deploy running"}'

      - name: Checkout
        if: steps.guard.outputs.needs_deploy == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        if: steps.guard.outputs.needs_deploy == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.needs_deploy == 'true'
        run: npm ci

      - name: Validate production data
        if: steps.guard.outputs.needs_deploy == 'true'
        run: npm run validate:data

      - name: Stamp exact build SHA
        if: steps.guard.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/__deploy
          printf '%s\n' "$GITHUB_SHA" > public/__deploy/version.txt

      - name: Build
        if: steps.guard.outputs.needs_deploy == 'true'
        run: npm run build

      - name: Dry deploy
        if: steps.guard.outputs.needs_deploy == 'true'
        run: npm run deploy:dry

      - name: Check Cloudflare deployment credentials
        if: steps.guard.outputs.needs_deploy == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d '{"state":"failure","context":"production/cloudflare/credentials","description":"Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_DEPLOY_HOOK"}' || true
            echo "::error::Cloudflare'a gerçek deploy yapacak GitHub Actions secret'ı yok. CLOUDFLARE_API_TOKEN veya CLOUDFLARE_DEPLOY_HOOK eklenmeden yayın mümkün değil."
            exit 1
          fi

      - name: Deploy to Cloudflare
        if: steps.guard.outputs.needs_deploy == 'true'
        id: deploy
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "mode=wrangler" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Workers'a doğrudan Wrangler deploy başlatılıyor."
            npx wrangler deploy
          else
            echo "mode=hook" >> "$GITHUB_OUTPUT"
            curl --fail --show-error --silent --request POST "$CLOUDFLARE_DEPLOY_HOOK"
            echo "Cloudflare deploy hook tetiklendi."
          fi

      - name: Verify exact production release
        if: steps.guard.outputs.needs_deploy == 'true'
        shell: bash
        env:
          DEPLOY_MODE: ${{ steps.deploy.outputs.mode }}
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          release_ok=0

          for attempt in $(seq 1 30); do
            fish_status=$(curl --silent --show-error --location -A "$ua" \
              --output /tmp/mirmir.html --write-out '%{http_code}' \
              "https://oltaatlasi.com/baliklar/mirmir/?deploy-check=${GITHUB_SHA}") || fish_status=000
            guide_status=$(curl --silent --show-error --location -A "$ua" \
              --output /tmp/mirmir-guide.html --write-out '%{http_code}' \
              "https://oltaatlasi.com/rehberler/kiyidan-mirmir-avi/?deploy-check=${GITHUB_SHA}") || guide_status=000

            if [ "$fish_status" = "200" ] \
              && [ "$guide_status" = "200" ] \
              && grep -Fq 'Lithognathus mormyrus' /tmp/mirmir.html \
              && grep -Fq 'Kıyıdan Mırmır Avı' /tmp/mirmir-guide.html; then
              release_ok=1
              break
            fi

            echo "Yeni rehber paketi henüz canlıda görünmüyor (deneme ${attempt}/30; fish=${fish_status}, guide=${guide_status})."
            sleep 10
          done

          if [ "$release_ok" -ne 1 ]; then
            echo "::error::Cloudflare deploy adımı çalıştı fakat yeni rehber paketi canlı uç noktada doğrulanamadı."
            exit 1
          fi

          if [ "$DEPLOY_MODE" = "wrangler" ]; then
            marker=$(curl --fail --show-error --silent --location -A "$ua" \
              "https://oltaatlasi.com/__deploy/version.txt?deploy-check=${GITHUB_SHA}")
            if [ "$marker" != "$GITHUB_SHA" ]; then
              echo "::error::Canlı build SHA eşleşmiyor. Beklenen ${GITHUB_SHA}, görülen ${marker}."
              exit 1
            fi
          fi

          curl --fail --show-error --silent --location -A "$ua" \
            -D /tmp/rum-headers.txt "https://oltaatlasi.com/?deploy-check=${GITHUB_SHA}" -o /tmp/rum-home.html

          for required_header in strict-transport-security content-security-policy x-frame-options x-content-type-options referrer-policy permissions-policy; do
            if ! grep -Eiq "^${required_header}:" /tmp/rum-headers.txt; then
              echo "::error::Canlı yanıtta ${required_header} başlığı bulunamadı."
              exit 1
            fi
          done

          echo "Production doğrulandı: yeni balık/rehber paketi canlı ve dağıtım modu ${DEPLOY_MODE}."

      - name: Publish final production commit status
        if: always() && steps.guard.outputs.needs_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description='Cloudflare production deploy verified'
          else
            state=failure
            description='Cloudflare production deploy failed; inspect Actions'
          fi
          payload=$(jq -nc --arg state "$state" --arg description "$description" '{state:$state,context:"production/cloudflare",description:$description}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
