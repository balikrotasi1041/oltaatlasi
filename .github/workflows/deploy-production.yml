name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olta-atlasi-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_SITE_URL: https://oltaatlasi.com
        run: npm run build

      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Current wrangler.jsonc ile doğrudan Worker deploy ediliyor."
            npx wrangler deploy
          elif [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            curl --fail --show-error --silent --request POST "$CLOUDFLARE_DEPLOY_HOOK"
            echo "Cloudflare deploy hook tetiklendi."
          else
            echo "mode=cloudflare-git" >> "$GITHUB_OUTPUT"
            echo "### Dağıtım modu: Cloudflare Git entegrasyonu" >> "$GITHUB_STEP_SUMMARY"
            echo "Doğrudan dağıtım secret'ı yok; main dalına bağlı Cloudflare Git dağıtımı esas alındı. Canlı uç noktalar aşağıdaki adımda doğrulanacak." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify production after deploy
        shell: bash
        run: |
          set -euo pipefail
          url="https://oltaatlasi.com/?rum-deploy-check=${GITHUB_SHA}"
          home_ok=0

          for attempt in $(seq 1 20); do
            curl --fail --show-error --silent --location \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml' \
              -D /tmp/rum-headers.txt "$url" -o /tmp/rum-home.html

            if grep -q '<title>' /tmp/rum-home.html \
              && grep -Eiq '^x-olta-security-policy:[[:space:]]*ip-blocklist-probe-guard-browser-headers-and-404-v4' /tmp/rum-headers.txt \
              && grep -Eiq '^strict-transport-security:' /tmp/rum-headers.txt; then
              home_ok=1
              break
            fi

            echo "Canlı sürüm henüz bu commit'in HTML ve güvenlik başlıklarını birlikte vermiyor (deneme ${attempt}/20)."
            sleep 6
          done

          if [ "$home_ok" -ne 1 ]; then
            echo "::error::Canlı ana sayfa veya güvenlik başlıkları doğrulanamadı."
            exit 1
          fi

          for required_header in content-security-policy x-frame-options x-content-type-options referrer-policy permissions-policy; do
            if ! grep -Eiq "^${required_header}:" /tmp/rum-headers.txt; then
              echo "::error::Canlı yanıtta ${required_header} başlığı bulunamadı."
              exit 1
            fi
          done

          if grep -Eiq '^cache-control:.*no-transform' /tmp/rum-headers.txt; then
            echo "::error::Cache-Control no-transform Cloudflare'ın otomatik RUM enjeksiyonunu engelleyebilir."
            exit 1
          fi

          http_redirect=$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://oltaatlasi.com/')
          case "$http_redirect" in
            301|308) ;;
            *)
              echo "::error::HTTP ana sayfa HTTPS'e kalıcı yönlendirme yerine ${http_redirect} döndü."
              exit 1
              ;;
          esac

          explicit_404_status=$(curl --silent --output /tmp/explicit-404.html --write-out '%{http_code}' \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://oltaatlasi.com/404')
          if [ "$explicit_404_status" != "404" ]; then
            echo "::error::/404 beklenen HTTP 404 yerine ${explicit_404_status} döndü."
            exit 1
          fi
          if ! grep -q 'Bu rota haritada görünmüyor' /tmp/explicit-404.html; then
            echo "::error::/404 özel hata sayfası gövdesi doğrulanamadı."
            exit 1
          fi

          for probe_path in /export.sql /build.gradle /rest/executions /webhook-waiting/test /v1.40/swarm /.amplifyrc '/%2eenv' '/%252eenv' '/wp%2dlogin.php'; do
            probe_status=$(curl --path-as-is --silent --output /dev/null --write-out '%{http_code}' "https://oltaatlasi.com${probe_path}")
            if [ "$probe_status" != "404" ]; then
              echo "::error::${probe_path} probe isteği HTTP 404 yerine ${probe_status} döndü."
              exit 1
            fi
          done

          trace_status=$(curl --silent --request TRACE --output /dev/null --write-out '%{http_code}' 'https://oltaatlasi.com/')
          case "$trace_status" in
            403|405) ;;
            *)
              echo "::error::TRACE isteği güvenli biçimde reddedilmek yerine ${trace_status} döndü."
              exit 1
              ;;
          esac

          if ! grep -q 'static.cloudflareinsights.com/beacon.min.js' /tmp/rum-home.html; then
            echo "::warning::RUM beacon HTML içinde görünmedi; otomatik enjeksiyon edge/yanıt koşullarına bağlı olabilir. Endpoint denetimi sürdürülecek."
          fi

          rum_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'https://oltaatlasi.com/cdn-cgi/rum')
          case "$rum_status" in
            5??)
              echo "::error::Cloudflare RUM toplama endpoint'i sağlıklı görünmüyor; HTTP ${rum_status}."
              exit 1
              ;;
            404)
              echo "::warning::RUM toplama endpoint'i GET isteğine HTTP 404 verdi; bu yöntem yanıtı beacon gönderimini tek başına doğrulamaz. Canlı HTML ve güvenlik başlıkları doğrulandı."
              ;;
            *)
              echo "Canlı site, güvenlik başlıkları, HTTPS yönlendirmesi, encoded probe guard, TRACE reddi, 404 davranışı ve Cloudflare RUM endpoint'i doğrulandı; endpoint HTTP ${rum_status}."
              ;;
          esac
