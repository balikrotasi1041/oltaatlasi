name: Quality gate

on:
  push:
    branches: [main, "quality/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  validate-build-dry-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decide whether scheduled main needs validation
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "needs_check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs=$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gate.yml/runs?branch=main&status=success&per_page=30")
          if echo "$runs" | jq -e --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha)' >/dev/null; then
            echo "needs_check=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_check=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.guard.outputs.needs_check == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.needs_check == 'true'
        run: npm ci

      - name: Validate route data
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run validate:routes

      - name: Probe active data and duplicate radar
        id: dup
        if: steps.guard.outputs.needs_check == 'true'
        shell: bash
        run: |
          set +e
          out=$(npm run validate:duplicates 2>&1)
          code=$?
          printf '%s\n' "$out"
          reason=$(printf '%s\n' "$out" | grep -E 'Dashboard içerik|İyileştirme hedefi|Error:|HATA:|Duplicate radar' | head -1 | tr -d '\r' | tr '%' '_' | cut -c1-180)
          if [ -z "$reason" ]; then reason=$(printf '%s\n' "$out" | tail -n 5 | tr '\n' ' ' | tr -d '\r' | tr '%' '_' | cut -c1-180); fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Active data ${{ steps.dup.outputs.reason }}
        if: steps.guard.outputs.needs_check == 'true'
        run: test "${{ steps.dup.outputs.code }}" = "0"

      - name: Maintenance audit
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run validate:maintenance

      - name: Build
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run build

      - name: Dry deploy
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run deploy:dry

      - name: Dispatch production deploy for validated main SHA
        if: steps.guard.outputs.needs_check == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches" -d '{"ref":"main"}'
