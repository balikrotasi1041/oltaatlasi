name: Quality gate

on:
  push:
    branches: [main, "quality/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  validate-build-dry-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Decide whether scheduled main needs validation
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "needs_check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality-gate.yml/runs?branch=main&status=success&per_page=30")

          if echo "$runs" | jq -e --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha)' >/dev/null; then
            echo "Current main SHA ${GITHUB_SHA} already passed Quality gate; scheduled heavy validation skipped."
            echo "needs_check=false" >> "$GITHUB_OUTPUT"
          else
            echo "Current main SHA ${GITHUB_SHA} has no successful Quality gate; validation required."
            echo "needs_check=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.guard.outputs.needs_check == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.needs_check == 'true'
        run: npm ci

      - name: Validate route data, duplicate radar and maintenance audit
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run validate:data

      - name: Build
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run build

      - name: Dry deploy
        if: steps.guard.outputs.needs_check == 'true'
        run: npm run deploy:dry

      - name: Dispatch production deploy for validated main SHA
        if: steps.guard.outputs.needs_check == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Production deploy workflow dispatched for validated main ${GITHUB_SHA}."
