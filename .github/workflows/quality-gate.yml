name: Quality gate

on:
  push:
    branches: [main, "quality/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-build-dry-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate route data
        run: npm run validate:data

      - name: Build
        run: npm run build

      - name: Dry deploy
        run: npm run deploy:dry
