name: Apply 28 July verified routes

on:
  push:
    branches: [daily-meralar-2026-07-28]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[daily-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daily-meralar-2026-07-28
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/apply-daily-meralar-2026-07-28.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run deploy:dry
      - name: Commit verified routes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Olta Atlası Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/meralar.ts public/images/meralar/
          git commit -m "Add 28 July verified fishing routes [daily-applied]"
          git push origin HEAD:daily-meralar-2026-07-28
