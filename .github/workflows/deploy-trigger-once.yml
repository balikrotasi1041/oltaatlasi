name: Trigger production deploy once

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-production.yml --ref main
