<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Palomar düğümü ikinci adım</title><desc id="desc">Çift kat misina ile gevşek üst düğüm kurulması.</desc><rect width="1200" height="675" rx="36" fill="#f8f5ed"/><rect x="55" y="55" width="1090" height="565" rx="28" fill="#fff" stroke="#dce5e1" stroke-width="4"/><text x="95" y="125" fill="#0a3340" font-family="system-ui, sans-serif" font-size="40" font-weight="800">2 · Gevşek üst düğümü oluştur</text><path d="M120 380C280 180 530 190 610 350c65 130-68 235-185 165-116-69-74-248 90-250 115-2 190 65 278 123" fill="none" stroke="#12576a" stroke-width="18" stroke-linecap="round"/><path d="M120 414C280 214 530 224 610 384c65 130-68 235-185 165-116-69-74-248 90-250 115-2 190 65 278 123" fill="none" stroke="#f6b44a" stroke-width="18" stroke-linecap="round"/><g transform="translate(900 400)"><ellipse cx="0" cy="0" rx="56" ry="78" fill="none" stroke="#0b2630" stroke-width="18"/><rect x="-15" y="70" width="30" height="105" rx="15" fill="#0b2630"/><circle cx="0" cy="195" r="38" fill="none" stroke="#0b2630" stroke-width="18"/></g><path d="M360 235c55-45 116-58 180-38" fill="none" stroke="#a84a3f" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 16"/><text x="95" y="565" fill="#5b6c70" font-family="system-ui, sans-serif" font-size="28">Düğümü henüz sıkma. Büyük halka ekipmanın üzerinden geçecek kadar açık kalsın.</text></svg>